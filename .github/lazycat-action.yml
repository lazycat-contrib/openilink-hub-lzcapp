version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/community.lazycat.app.openilink-hub.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  toolchains: []
  run_buildscript: false

images:
  - id: openilink-hub
    target: service
    service: openilink-hub
    source: ghcr.io/openilink/openilink-hub
    channel: stable
    sort: semver
    tag_regex: '^0\.1\.2$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: OpenILink Hub
    summary: Published from GitHub Actions
