application:
  subdomain: openilink-hub
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://openilink-hub:9800/

services:
  openilink-hub:
    user: root
    # ghcr.io/openilink/openilink-hub:0.1.2
    image: ghcr.1ms.run/openilink/openilink-hub:0.1.2
    environment:
      - RP_ORIGIN=https://${LAZYCAT_APP_DOMAIN}
      - RP_ID=${LAZYCAT_APP_DOMAIN}
    binds:
      - /lzcapp/var/data:/var/lib/openilink-hub
